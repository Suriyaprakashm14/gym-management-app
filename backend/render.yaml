# Render Blueprint: backend only. Connect repo with Root Directory = backend, or use a repo that contains only this backend.
# Set MONGODB_URI, JWTSECRET, FRONTEND_URL in Render Environment.
services:
  - type: web
    name: gym-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWTSECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
